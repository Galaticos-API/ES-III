spring:
  application:
    name: soc-agent
  main:
    web-application-type: none
    banner-mode: off
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${SOC_AGENT_MODEL:qwen2.5:7b}
          temperature: 0.1

logging:
  level:
    root: WARN
    br.fatec.esiii.socagent: INFO
